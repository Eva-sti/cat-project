<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Náhodná kočka 🐱</title>
    <link rel="stylesheet" href="catproject.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            text-align: center;
            padding: 50px;
            background-color: #f7f7f7;
        }

        img {
            max-width: 350px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        button {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Náhodný obrázek kočky 🐾</h1>
    <p>Klikni na tlačítko a načti novou kočku!</p>
    <button id="loadCat" class="btn btn-primary">Načíst obrázek</button>

    <div id="catContainer">
        <span id="placeholderText">Zde se objeví kočka 🐱</span>
    </div>    


      <script>
        async function fetchCatImage() {
            try {
                const response = await fetch('https://api.thecatapi.com/v1/images/search');
        const data = await response.json();
        const catImageUrl = data[0].url;

        const catContainer = document.getElementById('catContainer');
        // Obrázek se vloží pod text a placeholder zmizí
        catContainer.innerHTML = `<img src="${catImageUrl}" alt="Kočka" style="max-width: 350px; margin-top: 20px;">`;
    } catch (error) {
        console.error('Chyba při načítání obrázku:', error);
    }
}

// Přidání event listeneru na tlačítko
document.getElementById('loadCat').addEventListener('click', fetchCatImage);
      </script>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
      </script>
</body>

</html>
